<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lewis Rentals — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#172033;
}
.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#111827,#334155);
}
.card{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 20px 50px #0005;
}
.logo{
  font-size:27px;
  font-weight:bold;
  margin-bottom:5px;
}
.subtitle{
  color:#6b7280;
  margin-bottom:25px;
}
label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-bottom:6px;
}
input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  margin-bottom:16px;
  font-size:16px;
}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
}
.message{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  font-size:14px;
  display:none;
}
.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}
.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}
#app{
  display:none;
}
header{
  background:white;
  border-bottom:1px solid #ddd;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header-title{
  font-weight:bold;
  font-size:20px;
}
.logout{
  width:auto;
  padding:9px 15px;
  background:#111827;
}
main{
  padding:25px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}
.box{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
}
.number{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}
.muted{
  color:#6b7280;
}
.status{
  margin-top:20px;
  padding:15px;
  background:white;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login" class="login">
  <div class="card">

    <div class="logo">🏠 Lewis Rentals</div>
    <div class="subtitle">
      Admin property management • Kamulu, Nairobi
    </div>

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Admin email"
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Password"
    >

    <button id="loginButton" type="button">
      Sign in
    </button>

    <div id="message" class="message"></div>

  </div>
</section>


<!-- APP -->
<section id="app">

  <header>
    <div class="header-title">🏠 Lewis Rentals</div>

    <div>
      <span id="userEmail" class="muted"></span>
      <button id="logoutButton" class="logout">
        Log out
      </button>
    </div>
  </header>

  <main>

    <h1>Dashboard</h1>
    <p class="muted">
      Lewis Rentals • Kamulu, Nairobi
    </p>

    <div class="grid">

      <div class="box">
        <div class="muted">Total Rooms</div>
        <div id="roomsCount" class="number">—</div>
      </div>

      <div class="box">
        <div class="muted">Occupied</div>
        <div id="occupiedCount" class="number">—</div>
      </div>

      <div class="box">
        <div class="muted">Monthly Rent Potential</div>
        <div class="number">KSh 90,000</div>
      </div>

      <div class="box">
        <div class="muted">Water Rate</div>
        <div class="number">KSh 130</div>
      </div>

    </div>

    <div class="status">
      <strong>Admin account</strong>
      <p id="adminStatus" class="muted">
        Checking account...
      </p>
    </div>

  </main>

</section>


<script>

const SUPABASE_URL =
  "https://trnbtljkzehkrgkinzop.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vuC8A3VpCwrK8KLmCQ3Qvw_dmfl_3jU";


/* CREATE SUPABASE CLIENT */
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const login = document.getElementById("login");
const app = document.getElementById("app");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");
const message = document.getElementById("message");


function showMessage(text, type="error") {

  message.textContent = text;

  message.className =
    "message " + type;

}


function showLogin() {

  login.style.display = "flex";
  app.style.display = "none";

}


function showApp(user) {

  login.style.display = "none";
  app.style.display = "block";

  document.getElementById("userEmail").textContent =
    user.email || "";

}


/* LOGIN */
loginButton.addEventListener("click", async function () {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if (!email || !password) {

    showMessage(
      "Please enter your email and password."
    );

    return;

  }

  loginButton.disabled = true;
  loginButton.textContent = "Signing in...";

  showMessage(
    "Connecting to Lewis Rentals...",
    "success"
  );


  try {

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (result.error) {

      throw result.error;

    }


    const user =
      result.data.user;


    if (!user) {

      throw new Error(
        "Login succeeded but no user was returned."
      );

    }


    /* CHECK ADMIN PROFILE */

    const profileResult =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();


    if (profileResult.error) {

      throw profileResult.error;

    }


    if (
      !profileResult.data ||
      profileResult.data.role !== "admin"
    ) {

      await supabaseClient.auth.signOut();

      throw new Error(
        "This account is not registered as a Lewis Rentals administrator."
      );

    }


    showMessage(
      "Login successful!",
      "success"
    );

    showApp(user);

    await loadDashboard();


  } catch (error) {

    console.error(error);

    showMessage(
      "Login failed: " +
      (error.message || "Unknown error")
    );

  }


  loginButton.disabled = false;
  loginButton.textContent = "Sign in";

});


/* LOGOUT */

logoutButton.addEventListener("click", async function () {

  await supabaseClient.auth.signOut();

  showLogin();

});


/* LOAD DASHBOARD */

async function loadDashboard() {

  const roomsResult =
    await supabaseClient
      .from("rooms")
      .select("room_number");

  if (roomsResult.error) {

    document.getElementById("adminStatus").textContent =
      "Logged in, but rooms could not be loaded: " +
      roomsResult.error.message;

    return;

  }


  const rooms =
    roomsResult.data || [];

  document.getElementById("roomsCount").textContent =
    rooms.length;


  const tenantsResult =
    await supabaseClient
      .from("tenants")
      .select("room_number,status");


  if (!tenantsResult.error) {

    const occupied =
      (tenantsResult.data || [])
      .filter(t =>
        t.status !== "moved_out"
      ).length;

    document.getElementById("occupiedCount")
      .textContent = occupied;

  }


  document.getElementById("adminStatus").textContent =
    "Admin login verified successfully.";

}


/* CHECK EXISTING SESSION */

async function checkSession() {

  try {

    const result =
      await supabaseClient.auth.getSession();

    if (result.error) {

      throw result.error;

    }


    const session =
      result.data.session;


    if (!session) {

      showLogin();

      return;

    }


    const profileResult =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", session.user.id)
        .maybeSingle();


    if (
      profileResult.data &&
      profileResult.data.role === "admin"
    ) {

      showApp(session.user);

      await loadDashboard();

    } else {

      await supabaseClient.auth.signOut();

      showLogin();

    }

  } catch (error) {

    console.error(error);

    showLogin();

  }

}


/* START */

checkSession();

</script>

</body>
</html>
